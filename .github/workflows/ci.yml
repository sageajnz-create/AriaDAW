name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux system deps (Tauri/WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The crate embeds the built frontend via `generate_context!` and names
      # the engine as an externalBin, so neither `cargo test` nor `cargo clippy`
      # can run until both exist. setup.sh puts them there.
      - name: Bootstrap (frontend build + engine placeholder)
        shell: bash
        run: ./scripts/setup.sh
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # Does not compile acestep.cpp. It ships a tiny dummy sidecar so we can
  # check that a real `tauri build --bundles deb` puts ace-server in usr/bin,
  # refuses the setup.sh placeholder, and does not pack model weights.
  # For packages you can install, run ./scripts/package.sh on a Linux machine.
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system deps (Tauri/WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bundle checker (no Tauri build)
        run: ./scripts/verify-bundle.sh --self-test
      - name: Build and verify the Linux .deb layout
        run: ./scripts/package.sh --layout-check
      - name: Flatpak manifest is present
        run: |
          test -f packaging/flatpak/org.aria.music.yml
          grep -q 'id: org.aria.music' packaging/flatpak/org.aria.music.yml
          grep -q 'path: aria.deb' packaging/flatpak/org.aria.music.yml
