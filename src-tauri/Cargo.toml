[package]
name = "aria"
version = "0.1.0"
description = "Free, unlimited, local AI music creation"
authors = ["Aria contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview play audio files from the user's music folder.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "blocking"] }

rusqlite = { version = "0.32", features = ["bundled"] }
# Serves audio over plain localhost HTTP. WebKitGTK hands media URLs to
# GStreamer, which has no URI handler for custom schemes — so http:// is the
# only thing that actually plays.
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
thiserror = "2"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
# Used to tie the engine process's lifetime to ours (PR_SET_PDEATHSIG), so a
# force-quit can't leave a multi-GB GPU process running.
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
